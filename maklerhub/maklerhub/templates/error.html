<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MaklerHub — {{ title }}</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#101820;--gold:#C9A227;--gold-dim:#8C733C;--cream:#F6F1E4;--ink:#1B2430;--line:#E4DCC8;
  --font-h:'Fraunces',Georgia,serif;--font-b:'IBM Plex Sans',Arial,sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-b);background:var(--cream);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.box{max-width:440px;text-align:center;opacity:0;transform:translateY(14px);animation:up .7s cubic-bezier(.2,.7,.2,1) forwards;}
@keyframes up{to{opacity:1;transform:none;}}
.brand{display:inline-flex;align-items:center;gap:9px;font-family:var(--font-h);font-weight:700;font-size:1.1rem;color:var(--navy);text-decoration:none;margin-bottom:34px;}
.brand img{width:28px;height:22px;object-fit:contain;}
.code{font-family:var(--font-h);font-size:4.2rem;font-weight:600;color:var(--gold-dim);line-height:1;}
h1{font-family:var(--font-h);font-weight:600;font-size:1.5rem;color:var(--navy);margin:12px 0 10px;}
p{color:#8A8372;font-size:.92rem;line-height:1.6;}
.line{width:46px;height:2px;background:linear-gradient(90deg,var(--gold),transparent);margin:22px auto;}
.btn{position:relative;overflow:hidden;display:inline-block;text-decoration:none;padding:12px 24px;border-radius:2px;background:var(--gold);color:#201803;font-weight:600;font-size:.88rem;transition:transform .2s ease,box-shadow .2s ease;}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(201,162,39,.32);}
</style>
</head>
<body>
<div class="box">
  <a class="brand" href="{{ url_for('public.landing') }}"><img src="{{ url_for('static', filename='img/logo.png') }}" alt="">MaklerHub</a>
  <div class="code">{{ code }}</div>
  <h1>{{ title }}</h1>
  <p>{{ text }}</p>
  <div class="line"></div>
  <a class="btn" href="{{ url_for('public.landing') }}">Ana səhifəyə qayıt</a>
</div>
</body>
</html>
