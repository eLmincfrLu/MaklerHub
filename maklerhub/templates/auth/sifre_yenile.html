{% extends 'auth/giris.html' %}
{% block title %}Yeni şifrə{% endblock %}
{% block card %}
      <div class="kicker">Salam, {{ name }}</div>
      <h1>Yeni <i>şifrə təyin edin</i></h1>
      <div class="underline"></div>

      {% if error %}<div class="alert err">{{ error }}</div>{% endif %}

      <form method="post" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field">
          <label for="pass">Yeni şifrə</label>
          <div class="input-line">
            <svg class="field-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.6"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            <input id="pass" name="password" type="password" placeholder="••••••••" autocomplete="new-password" required>
            <svg class="eye" data-target="pass" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </div>
        </div>
        <div class="field">
          <label for="pass2">Yeni şifrə (təkrar)</label>
          <div class="input-line">
            <svg class="field-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.6"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            <input id="pass2" name="password2" type="password" placeholder="••••••••" autocomplete="new-password" required>
          </div>
        </div>
        <div class="trust" style="margin:-8px 0 24px">Minimum 8 simvol, ən azı bir rəqəm daxil olmalıdır.</div>
        <button class="btn" type="submit">Şifrəni yadda saxla</button>
      </form>
{% endblock %}
