{#- E-poçt şablonu: cədvəl əsaslı, inline stil (poçt proqramları üçün). url_for YOX — ünvanlar base ilə gəlir. -#}
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#F6F1E4;font-family:Arial,Helvetica,sans-serif;color:#1B2430;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{% block preheader %}{% endblock %}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F6F1E4;">
  <tr><td align="center" style="padding:28px 14px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;">
      <tr><td style="padding:0 4px 18px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
          <td style="padding-right:10px;"><img src="{{ base }}/static/img/logo.png" width="34" height="27" alt="" style="display:block;border:0;border-radius:4px;"></td>
          <td style="font-family:Georgia,'Times New Roman',serif;font-size:19px;font-weight:bold;color:#101820;">MaklerHub</td>
        </tr></table>
      </td></tr>
      <tr><td style="background:#FFFFFF;border:1px solid #E4DCC8;border-top:3px solid #C9A227;border-radius:4px;padding:28px 26px;">
        {% block body %}{% endblock %}
      </td></tr>
      <tr><td style="padding:18px 6px 0;font-size:12px;line-height:1.6;color:#8A8372;text-align:center;">
        {% block footer %}{% endblock %}
        <div style="margin-top:8px;">MaklerHub · Bakı</div>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
