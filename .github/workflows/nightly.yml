# Hər gün 23:00 UTC (Bakı 03:00): kirayə üçün tam sayğı; Bakı vaxtı ilə bazar günü satış da.
# GitHub-da bir iş maksimum 6 saatdır → satış 3 hissəyə bölünür (--chunk 1/3, 2/3, 3/3), ardıcıl işlər.
# Hər iş içində 15 dəqiqəlik fast dövrü işləyir; cədvəlli fast bu müddətdə növbədə gözləyir (eyni concurrency qrupu).
# Cədvəl YALNIZ repo dəyişəni SCRAPER_ENABLED=true olanda işləyir.
name: nightly

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      deal:
        description: "auto = kirayə, bazar günü satış da"
        type: choice
        options: [auto, rent, sale, both]
        default: auto

permissions:
  contents: read

concurrency:
  group: scraper
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8
  MAKLERHUB_NO_LOCK: "1"
  BLOCKED_OK: "1"

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || vars.SCRAPER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rent: ${{ steps.p.outputs.rent }}
      sale: ${{ steps.p.outputs.sale }}
    steps:
      - id: p
        env:
          DEAL: ${{ inputs.deal }}
        run: |
          deal="${DEAL:-auto}"
          if [ "$deal" = "auto" ]; then
            if [ "$(TZ=Asia/Baku date +%u)" = "7" ]; then deal=both; else deal=rent; fi
          fi
          rent=false; sale=false
          case "$deal" in
            rent) rent=true ;;
            sale) sale=true ;;
            both) rent=true; sale=true ;;
          esac
          echo "rent=$rent" >> "$GITHUB_OUTPUT"
          echo "sale=$sale" >> "$GITHUB_OUTPUT"
          echo "plan: deal=$deal (kirayə=$rent, satış=$sale)"

  rent:
    needs: plan
    if: needs.plan.outputs.rent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-scraper
      - name: nightly kirayə
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash .github/scripts/run-scraper.sh nightly --deal rent
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: scraper/state
          key: scraper-state-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

  sale-1:
    needs: [plan, rent]
    if: ${{ !cancelled() && needs.plan.outputs.sale == 'true' && (needs.rent.result == 'success' || needs.rent.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-scraper
      - name: nightly satış 1/3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash .github/scripts/run-scraper.sh nightly --deal sale --chunk 1/3
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: scraper/state
          key: scraper-state-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

  sale-2:
    needs: sale-1
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-scraper
      - name: nightly satış 2/3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash .github/scripts/run-scraper.sh nightly --deal sale --chunk 2/3
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: scraper/state
          key: scraper-state-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

  sale-3:
    needs: sale-2
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-scraper
      - name: nightly satış 3/3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash .github/scripts/run-scraper.sh nightly --deal sale --chunk 3/3
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: scraper/state
          key: scraper-state-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
