# Yalnız əl ilə: tam sayğı (python -m scraper.auto nightly). Avtomatik tam sayğı loop.yml-in içindədir.
# Sayğı DAVAM EDƏNDİR: hansı axınların bitdiyi bazadadır (settings.nightly_progress); 330 dəqiqədə iş dayanır və
# növbəti nightly / loop işi qaldığı yerdən davam edir (bazar günü satış da — ayrıca hissələrə bölmək lazım deyil).
# Yoxa çıxanlar yalnız BÜTÜN axınlar bitəndən sonra işarələnir. İçində hər 15 dəq fast dövrü işləyir.
name: nightly

on:
  workflow_dispatch:
    inputs:
      deal:
        description: "YENİ sayğı üçün: auto = kirayə, bazar günü satış da (yarımçıq sayğı varsa o davam edir)"
        type: choice
        options: [auto, rent, sale, both]
        default: auto
      restart:
        description: "yarımçıq sayğını at və yenisini başlat"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-scraper
      - name: nightly
        env:
          PYTHONIOENCODING: utf-8
          MAKLERHUB_NO_LOCK: "1"
          BLOCKED_OK: "1"
          DEAL: ${{ inputs.deal || 'auto' }}
          RESTART: ${{ inputs.restart && '--restart' || '' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash .github/scripts/run-scraper.sh nightly --deal "$DEAL" --deadline-minutes 330 $RESTART
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: scraper/state
          key: scraper-state-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - name: loop zəncirini bərpa et
        if: ${{ !cancelled() && vars.SCRAPER_ENABLED == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run loop.yml --ref "$GITHUB_REF_NAME" -f chain=true
