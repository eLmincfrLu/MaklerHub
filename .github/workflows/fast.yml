# Yalnız əl ilə: python -m scraper.auto fast (52 Bina + 6 Tap axını, 1-ci səhifə). Cədvəl loop.yml-dədir.
# Eyni concurrency qrupundadır: loop işləyirsə növbədə gözləyir (və ya loop-un növbəti işi onu əvəz edir).
# SCRAPER_ENABLED=true olanda sonda loop zəncirini bərpa edir (bu iş növbədə loop-u əvəz etmişdisə).
name: fast

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# fast, nightly, baseline və loop eyni qrupdadır: eyni anda yalnız biri işləyir (saytlara sorğular ardıcıl gedir).
concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-scraper
      - name: fast
        env:
          PYTHONIOENCODING: utf-8
          MAKLERHUB_NO_LOCK: "1"
          BLOCKED_OK: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash .github/scripts/run-scraper.sh fast
      - name: cooldown vəziyyəti (cache-ə)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scraper/state
          key: scraper-state-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - name: loop zəncirini bərpa et
        if: ${{ !cancelled() && vars.SCRAPER_ENABLED == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run loop.yml --ref "$GITHUB_REF_NAME" -f chain=true
